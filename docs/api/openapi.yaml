openapi: 3.1.0
info:
  title: PlayRush Backend API
  version: 0.4.0
  description: M04 foundation, identity/access, player profile, and private XP history API. Authentication tokens use cookies and are never returned in JSON. XP awards are internal-only and have no HTTP route.
servers:
  - url: http://127.0.0.1:3000/api/v1
    description: Local XAMPP MariaDB development
paths:
  /health:
    get:
      operationId: getHealth
      summary: Check HTTP and database availability
      security: []
      responses:
        '200':
          description: Application and database are available
          headers:
            X-Request-Id:
              $ref: '#/components/headers/RequestId'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HealthResponse'
        '429':
          $ref: '#/components/responses/RateLimited'
        '503':
          $ref: '#/components/responses/ServiceUnavailable'
  /auth/register:
    post:
      operationId: registerAccount
      summary: Register a pending player account
      description: Normalizes identity values, stores an Argon2id password hash, and requests verification delivery.
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RegisterRequest'
      responses:
        '201':
          description: Pending account created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UserResponse'
        '400':
          $ref: '#/components/responses/InvalidRequest'
        '409':
          description: Email or username is already registered; the conflicting field is not disclosed
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '429':
          $ref: '#/components/responses/AuthRateLimited'
  /auth/verify-email:
    post:
      operationId: verifyEmail
      summary: Consume a single-use email-verification token
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [token]
              properties:
                token:
                  type: string
                  pattern: '^[A-Za-z0-9_-]{43}$'
      responses:
        '204':
          description: Email verified and account activated
        '400':
          $ref: '#/components/responses/InvalidRequest'
        '401':
          description: Token is unknown, expired, or already consumed
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '429':
          $ref: '#/components/responses/AuthRateLimited'
  /auth/login:
    post:
      operationId: login
      summary: Authenticate an active verified account
      description: Sets access, rotating refresh, and signed CSRF cookies. Invalid email and password share one response.
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LoginRequest'
      responses:
        '200':
          description: Authenticated; cookies are set on the response
          headers:
            Set-Cookie:
              schema:
                type: string
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuthResponse'
        '400':
          $ref: '#/components/responses/InvalidRequest'
        '401':
          description: Email or password is incorrect
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '403':
          description: Verification is required or the account is suspended
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '429':
          $ref: '#/components/responses/AuthRateLimited'
  /auth/refresh:
    post:
      operationId: refreshSession
      summary: Rotate a refresh token and issue a new cookie set
      description: Requires a refresh cookie and matching signed session-bound CSRF cookie/header. Reuse revokes the token family.
      security:
        - refreshCookie: []
          csrfHeader: []
      responses:
        '200':
          description: Session rotated and replacement cookies set
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuthResponse'
        '401':
          description: Session is invalid, expired, or replayed
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '403':
          description: CSRF validation failed or account is suspended
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
  /auth/logout:
    post:
      operationId: logout
      summary: Revoke the current refresh session and clear authentication cookies
      description: Idempotent. A supplied refresh cookie requires its matching CSRF header and cookie.
      security:
        - refreshCookie: []
          csrfHeader: []
      responses:
        '204':
          description: Session revoked or already absent; cookies cleared
        '403':
          description: CSRF validation failed
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
  /auth/me:
    get:
      operationId: getCurrentUser
      summary: Return the currently authenticated user
      security:
        - accessCookie: []
      responses:
        '200':
          description: Current account and session are valid
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UserResponse'
        '401':
          description: Access token or backing session is invalid or expired
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '403':
          description: Account is suspended
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
  /auth/admin-check:
    get:
      operationId: checkAdminAuthorization
      summary: Minimal M03 authorization probe
      description: Proves server-side admin-role enforcement; this is not an administration module.
      security:
        - accessCookie: []
      responses:
        '200':
          description: Authenticated account currently has the admin role
          content:
            application/json:
              schema:
                type: object
                additionalProperties: false
                required: [data]
                properties:
                  data:
                    type: object
                    additionalProperties: false
                    required: [authorized]
                    properties:
                      authorized:
                        const: true
        '401':
          description: Authentication is missing or invalid
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '403':
          description: Admin role is required
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
  /players/me:
    get:
      operationId: getMyPlayerProfile
      summary: Read the authenticated player's profile and progression cache
      description: Creates a missing profile deterministically using the active progression policy. The response contains no email, role, or another player's data.
      security:
        - accessCookie: []
      responses:
        '200':
          description: Current player profile
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PlayerProfileResponse'
        '401':
          description: Authentication is missing or invalid
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '403':
          description: Account is suspended
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '503':
          $ref: '#/components/responses/ServiceUnavailable'
    patch:
      operationId: updateMyPlayerProfile
      summary: Update approved display fields on the authenticated player's profile
      description: Requires the signed session-bound CSRF cookie value in X-CSRF-Token. Unknown and protected fields, including XP, level, role, status, scores, unlocks, and user IDs, are rejected.
      security:
        - accessCookie: []
          refreshCookie: []
          csrfHeader: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PlayerProfilePatch'
      responses:
        '200':
          description: Updated player profile
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PlayerProfileResponse'
        '400':
          $ref: '#/components/responses/InvalidRequest'
        '401':
          description: Authentication is missing or invalid
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '403':
          description: CSRF validation failed or the account is suspended
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '503':
          $ref: '#/components/responses/ServiceUnavailable'
  /players/me/xp-history:
    get:
      operationId: getMyXpHistory
      summary: Read the authenticated player's private XP ledger history
      description: Returns a stable newest-first page ordered by ledger creation time and ID. The cursor is opaque and scoped by the authenticated player; internal metadata and database IDs are not exposed.
      security:
        - accessCookie: []
      parameters:
        - name: cursor
          in: query
          required: false
          description: Opaque nextCursor returned by the previous page.
          schema:
            type: string
            minLength: 1
            maxLength: 512
        - name: limit
          in: query
          required: false
          description: Page size; defaults to 20.
          schema:
            type: integer
            minimum: 1
            maximum: 100
            default: 20
      responses:
        '200':
          description: Private XP history page
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/XpHistoryResponse'
        '400':
          $ref: '#/components/responses/InvalidRequest'
        '401':
          description: Authentication is missing or invalid
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '403':
          description: Account is suspended
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
components:
  securitySchemes:
    accessCookie:
      type: apiKey
      in: cookie
      name: __Host-playrush_access
      description: Production name. Non-Secure local HTTP uses playrush_access.
    refreshCookie:
      type: apiKey
      in: cookie
      name: __Host-playrush_refresh
      description: Production name. Non-Secure local HTTP uses playrush_refresh.
    csrfHeader:
      type: apiKey
      in: header
      name: X-CSRF-Token
  headers:
    RequestId:
      schema:
        type: string
        format: uuid
  schemas:
    RegisterRequest:
      type: object
      additionalProperties: false
      required: [email, username, password]
      properties:
        email:
          type: string
          format: email
          maxLength: 254
        username:
          type: string
          pattern: '^[a-zA-Z0-9_]{3,30}$'
        password:
          type: string
          minLength: 12
          maxLength: 128
          writeOnly: true
          description: Must contain uppercase, lowercase, and numeric characters.
    LoginRequest:
      type: object
      additionalProperties: false
      required: [email, password]
      properties:
        email:
          type: string
          format: email
        password:
          type: string
          minLength: 1
          maxLength: 128
          writeOnly: true
    User:
      type: object
      additionalProperties: false
      required: [id, email, username, role, status, emailVerified]
      properties:
        id:
          type: string
          format: uuid
        email:
          type: string
          format: email
        username:
          type: string
        role:
          type: string
          enum: [player, admin]
        status:
          type: string
          enum: [pending_verification, active, suspended, deleted]
        emailVerified:
          type: boolean
        sessionId:
          type: string
          format: uuid
    UserResponse:
      type: object
      additionalProperties: false
      required: [data]
      properties:
        data:
          type: object
          additionalProperties: false
          required: [user]
          properties:
            user:
              $ref: '#/components/schemas/User'
    AuthResponse:
      type: object
      additionalProperties: false
      required: [data]
      properties:
        data:
          type: object
          additionalProperties: false
          required: [user, accessTokenExpiresAt]
          properties:
            user:
              $ref: '#/components/schemas/User'
            accessTokenExpiresAt:
              type: string
              format: date-time
    PlayerProfilePatch:
      type: object
      additionalProperties: false
      minProperties: 1
      properties:
        displayName:
          type: [string, 'null']
          minLength: 1
          maxLength: 80
          description: Trimmed display name; null clears it.
        bio:
          type: [string, 'null']
          maxLength: 500
          description: Trimmed profile biography; null clears it.
    PlayerProfile:
      type: object
      additionalProperties: false
      required:
        [id, username, displayName, bio, totalXp, level, allTimeBestScore, createdAt, updatedAt]
      properties:
        id:
          type: string
          format: uuid
        username:
          type: string
        displayName:
          type: [string, 'null']
        bio:
          type: [string, 'null']
        totalXp:
          type: integer
          format: int64
          minimum: 0
          maximum: 9007199254740991
          readOnly: true
        level:
          type: integer
          minimum: 1
          readOnly: true
        allTimeBestScore:
          type: integer
          format: int64
          minimum: 0
          maximum: 9007199254740991
          readOnly: true
        createdAt:
          type: string
          format: date-time
          readOnly: true
        updatedAt:
          type: string
          format: date-time
          readOnly: true
    PlayerProfileResponse:
      type: object
      additionalProperties: false
      required: [data]
      properties:
        data:
          type: object
          additionalProperties: false
          required: [profile]
          properties:
            profile:
              $ref: '#/components/schemas/PlayerProfile'
    XpHistoryItem:
      type: object
      additionalProperties: false
      required: [amount, balanceAfter, sourceType, sourceReference, createdAt]
      properties:
        amount:
          type: integer
          format: int64
          minimum: -9007199254740991
          maximum: 9007199254740991
        balanceAfter:
          type: integer
          format: int64
          minimum: 0
          maximum: 9007199254740991
        sourceType:
          type: string
          enum: [gameplay, leaderboard_reward, achievement, admin_adjustment, correction]
        sourceReference:
          type: string
          maxLength: 191
          description: Opaque server provenance reference.
        createdAt:
          type: string
          format: date-time
    XpHistoryResponse:
      type: object
      additionalProperties: false
      required: [data, pagination]
      properties:
        data:
          type: object
          additionalProperties: false
          required: [items]
          properties:
            items:
              type: array
              items:
                $ref: '#/components/schemas/XpHistoryItem'
        pagination:
          type: object
          additionalProperties: false
          required: [nextCursor, limit]
          properties:
            nextCursor:
              type: [string, 'null']
            limit:
              type: integer
              minimum: 1
              maximum: 100
    HealthResponse:
      type: object
      additionalProperties: false
      required: [status, timestamp, checks]
      properties:
        status:
          const: ok
        timestamp:
          type: string
          format: date-time
        checks:
          type: object
          additionalProperties: false
          required: [database]
          properties:
            database:
              const: up
    ErrorResponse:
      type: object
      additionalProperties: false
      required: [error]
      properties:
        error:
          type: object
          additionalProperties: false
          required: [code, message, requestId]
          properties:
            code:
              type: string
            message:
              type: string
            requestId:
              type: string
              format: uuid
  responses:
    InvalidRequest:
      description: Request validation failed
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
    RateLimited:
      description: Global request rate limit exceeded
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
    AuthRateLimited:
      description: Authentication attempt rate limit exceeded
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
    ServiceUnavailable:
      description: A required database resource or active policy is unavailable
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
